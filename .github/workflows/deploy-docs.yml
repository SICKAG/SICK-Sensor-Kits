name: Deploy MkDocs (EN + DE)

on:  
  push:  
    branches:  
            - main  
  workflow_dispatch:

concurrency:  
  group: "pages-deploy"  
  cancel-in-progress: true

permissions:  
  contents: write

jobs:  
  deploy:  
    runs-on: ubuntu-latest  
    steps:  
      - name: Checkout repository  
        uses: actions/checkout@v4  
        with:  
          fetch-depth: 0

      - name: Setup Python  
        uses: actions/setup-python@v5  
        with:  
          python-version: '3.12'

      - name: Install dependencies  
        run: |  
          python -m pip install --upgrade pip  
          pip install mkdocs-material mkdocs-video

      - name: Build English site  
        run: mkdocs build -f mkdocs.en.yaml

      - name: Build German site  
        run: mkdocs build -f mkdocs.de.yaml

      - name: Add root redirect          # ← NEU  
        run: cp redirect/index.html site/index.html

      - name: Deploy to GitHub Pages  
        uses: peaceiris/actions-gh-pages@v4  
        with:  
          github_token: ${{ secrets.GITHUB_TOKEN }}  
          publish_dir: ./site  
