site_name: SICK Sensor Starter Kits
site_url: https://sickag.github.io/SICK-Sensor-Starter-Kits/de/

repo_url: https://github.com/SICKAG/SICK-Sensor-Starter-Kits
repo_name: SICKAG/SICK-Sensor-Starter-Kits

docs_dir: docs/de
site_dir: site/de

theme:
  language: de
  name: material
  palette:
    primary: custom
  font:
    text: 'Roboto'
    code: 'Roboto Mono'
  logo: 'images/sick_logo.png'
  features:
    - content.code.copy
  favicon: 'images/favicon.ico'
extra_css:
  - stylesheets/extra.css
copyright: "© SICK AG 2026"
plugins:
  - mkdocs-video


markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - def_list
  - attr_list
  - md_in_html
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  alternate:
    - name: English
      link: /SICK-Sensor-Starter-Kits/en/
      lang: en
    - name: Deutsch
      link: /SICK-Sensor-Starter-Kits/de/
      lang: de

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SICKAG
      name: SICK on GitHub

    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/user/SICKSensors
      name: SICK on YouTube

    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/sicksensorintelligence/
      name: SICK on LinkedIn

nav:  
    - Startseite: index.md  
    - Vision Starter Kit:  
        - Übersicht: vision/vision_overview.md  
        - Erste Schritte: vision/vision_getting_started.md  
        - Vision Starter-Projekt: vision/vision_starter_project.md  
        - Beispielprojekte:  
                - Übersicht: vision/vision_example_projects.md  
                - Sechskantmuttern/Schrauben klassifizieren: vision/classify_hex_nuts_screws.md  
                - Schokoladen-Inspektion: vision/chocolate_inspection.md  
                - Skizzen-Demonstrator: vision/sketch_demonstrator.md  
                - Schere, Stein, Papier: vision/rock_paper_scissors.md  
                - Recycling: vision/recycling.md  
                - Black Jack: vision/blackjack.md  
                - UNO Kartenspiel: vision/uno.md  
                - Tic Tac Toe: vision/tic_tac_toe.md  
                - Darts: vision/darts.md  
        - Vision Code-Beispiele: vision/vision_code_snippets.md  
        - Weiterführende Themen: vision/vision_advanced.md  
        - Schulungsmaterial:  
                - Übersicht: vision/vision_training_material.md  
                - Montagerahmen einrichten: mounting_frame.md  
        - FAQ - Vision: vision/vision_faq.md  
    - LiDAR Starter Kit:  
        - Übersicht: lidar/lidar_overview.md  
        - Erste Schritte: lidar/lidar_getting_started.md  
        - LiDAR Starter-Projekt: lidar/lidar_field_evaluation.md  
        - Beispielprojekte:  
                - Übersicht: lidar/lidar_example_projects.md  
                - Distanzschätzung: lidar/distance_estimation.md  
                - Der Boden ist Lava: lidar/lidar_floor_is_lava.md  
                - Luft-Klavier: lidar/lidar_human_piano_air_piano.md  
        - LiDAR Code-Beispiele: lidar/lidar_code_snippets.md  
        - Weiterführende Themen: lidar/lidar_advanced.md  
        - Schulungsmaterial: lidar/lidar_training_material.md  
        - FAQ - LiDAR: lidar/lidar_faq.md  
    - IO-Link Connectivity Starter Kit:  
        - Übersicht: iolink/iolink_overview.md  
        - Erste Schritte: iolink/iolink_getting_started.md  
        - Code-Beispiele: iolink/iolink_code_snippets.md  
        - Weiterführende Themen: iolink/iolink_advanced.md  
        - Beispielprojekte:  
            - Übersicht: iolink/iolink_example_projects.md  
            - SensorFusion: iolink/sensor_fusion.md  
            - Smarte Zugfahrt: iolink/iolink_train.md  
        - Schulungsmaterial: iolink/iolink_training_material.md  
        - FAQ: iolink/iolink_faq.md  
    - FAQ: faq.md  
    - Impressum: https://www.sick.com/de/de/s/imprint  
