      - Übersicht: vision/vision_example_projects.md
      - Vision Starter Projekt: vision/vision_starter_project.md
      - Sechskantmuttern/Schrauben klassifizieren: vision/classify_hex_nuts_screws.md
      - Sketch Demonstrator: vision/sketch_demonstrator.md
      - Schokoladenprüfung: vision/chocolate_inspection.md
      - Schere, Stein, Papier: vision/rock_paper_scissors.md
      - Recycling: vision/recycling.md
