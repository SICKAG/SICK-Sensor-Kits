site_name: SICK Sensor Starter Kits
site_url: https://sickag.github.io/SICK-Sensor-Kits/en/

repo_url: https://github.com/SICKAG/SICK-Sensor-Starter-Kits
repo_name: SICKAG/SICK-Sensor-Starter-Kits

docs_dir: docs/de
site_dir: site/de

theme:
  language: en
  name: material
  palette:
    primary: custom
  font:
    text: 'Roboto'
    code: 'Roboto Mono'
  logo: 'images/sick_logo.png'
  features:
    - content.code.copy
  favicon: 'images/favicon.ico'
extra_css:
  - stylesheets/extra.css
copyright: "© SICK AG 2026"
plugins:
  - mkdocs-video


markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - def_list
  - attr_list
  - md_in_html
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  alternate:
    - name: English
      link: http://127.0.0.1:8000/
      lang: en
    - name: Deutsch
      link: http://127.0.0.1:8001/
      lang: de
  
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SICKAG
      name: SICK on GitHub

    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/user/SICKSensors
      name: SICK on YouTube

    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/sicksensorintelligence/
      name: SICK on LinkedIn


